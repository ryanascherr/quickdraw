<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./scss/main.css">
    <title>Quickdraw</title>
</head>
<body>
    <h1>Quickdraw Battle Simulator</h1>
    <div class="instruction-text js_instructional-text"></div>
    <div class="team-selector js_team-selector hidden">
        <div class="team-selector-btns">
            <button class="js_team-btn" data-team="Bandits">The Bandits</button>
            <button class="js_team-btn" data-team="Law">The Law</button>
        </div>
    </div>
    <div class="card-holder js_card-holder hidden">
        <div class="confirm-btn-holder">
            <button class="js_confirm-units" disabled>Confirm</button>
        </div>
        <div class="bandit-holder">
            <img class="card js_card-select" src="./img/bandit_captain-blythe.png" alt="" data-name="Captain Blythe">
            <img class="card js_card-select" src="./img/bandit_bruiser.png" alt="" data-name="Bruiser">
            <img class="card js_card-select" src="./img/bandit_sister.png" alt="" data-name="Sister">
            <img class="card js_card-select" src="./img/bandit_sniper.png" alt="" data-name="Sniper">
            <img class="card js_card-select" src="./img/bandit_brother.png" alt="" data-name="Brother">
            <img class="card js_card-select" src="./img/bandit_crazy-carl.png" alt="" data-name="Crazy Carl">
            <img class="card js_card-select" src="./img/bandit_dan-o-mite.png" alt="" data-name="Dan O Mite">
            <img class="card js_card-select" src="./img/bandit_snake.png" alt="" data-name="Snake">
        </div>
        <div class="law-holder">
            <img class="card js_card-select" src="./img/law_sheriff-mcgraw.png" alt="" data-name="Sheriff McGraw">
            <img class="card js_card-select" src="./img/law_mysterious-stranger.png" alt="" data-name="Mysterious Stranger">
            <img class="card js_card-select" src="./img/law_lawman.png" alt="" data-name="Lawman">
            <img class="card js_card-select" src="./img/law_us-marshall.png" alt="" data-name="US Marshall">
            <img class="card js_card-select" src="./img/law_deputy.png" alt="" data-name="Deputy">
            <img class="card js_card-select" src="./img/law_doc.png" alt="" data-name="Doc">
            <img class="card js_card-select" src="./img/law_retired-lawman.png" alt="" data-name="Retired Lawman">
            <img class="card js_card-select" src="./img/law_trainee.png" alt="" data-name="Trainee">
        </div>
    </div>
    <div class="main-street js_main-street hidden">
        <div class="confirm-btn-holder">
            <button class="js_confirm-locations" disabled>Confirm</button>
        </div>
        <div class="bandits-location-container"></div>
        <div class="law-location-container"></div>
    </div>
    <div class="arena js_arena hidden">
        <div class="locations-container">
            <div class="locations-container__bandits">
                <div class="roof">
                    <h3>ROOF</h3>
                </div>
                <div class="building">
                    <h3>BUILDING</h3>
                </div>
                <div class="street">
                    <h3>STREET</h3>
                </div>
            </div>
            <div class="locations-container__law">
                <div class="street">
                    <h3>STREET</h3>
                </div>
                <div class="building">
                    <h3>BUILDING</h3>
                </div>
                <div class="roof">
                    <h3>ROOF</h3>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./scripts/script.js"></script>
</body>
</html>
